<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ยอดขาย</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F7F7F5;--card:#fff;--ink:#1F2430;--mute:#8A90A0;--line:#ECECE7;--price:#A3ABBA;--net:#F59E0B;--so:#4F46E5;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#14151A;--card:#1B1D24;--ink:#ECEDF2;--mute:#8D93A3;--line:#2A2D37;--price:#7C8498;--net:#FBBF24;--so:#818CF8;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Thai',system-ui,sans-serif;font-size:14px;line-height:1.5}
[hidden]{display:none!important}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1200px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:16px}
nav{display:flex;gap:4px;flex:1;min-width:0;overflow-x:auto}
nav button{font:inherit;font-size:15px;border:0;background:none;color:var(--mute);padding:8px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
nav button:hover{color:var(--ink)}
nav button.on{color:var(--ink);font-weight:600;background:var(--card);box-shadow:0 0 0 1px var(--line)}
select{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.lo{font:inherit;font-size:13px;border:0;background:none;color:var(--mute);cursor:pointer;padding:6px}
.lo:hover{color:var(--ink)}
.wrap{max-width:1200px;margin:0 auto;padding:20px}
#msg{display:none;background:var(--card);border:1px solid #E0786A;color:#C2503F;padding:10px 12px;border-radius:10px;margin-bottom:14px}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:14px}
.card,.panel{background:var(--card);border:1px solid var(--line);border-radius:14px}
.card{padding:16px 18px;min-width:0}
.card .l{font-size:13px;color:var(--mute);display:flex;align-items:center;gap:7px}
.card .l i{width:7px;height:7px;border-radius:50%;flex:none}
.card .v{font-size:clamp(20px,2.4vw,30px);font-weight:600;margin-top:8px;letter-spacing:-.01em;white-space:nowrap;font-variant-numeric:tabular-nums}
.card .s{font-size:12px;color:var(--mute);margin-top:2px}
.panel{padding:16px 18px;min-width:0}
.ph{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:8px}
h2{font-size:15px;font-weight:600;margin:0}
h3{font-size:15px;font-weight:600;margin:26px 0 12px}
.sv{font-size:12.5px;color:var(--mute);font-variant-numeric:tabular-nums}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--mute)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:3px;border-radius:2px;display:inline-block}
.legend .dash i{height:0;border-top:2px dashed var(--mute);border-radius:0}
.chart{position:relative}
.chart svg{width:100%;height:auto;display:block}
.tip{position:absolute;top:6px;pointer-events:none;background:var(--card);border:1px solid var(--line);box-shadow:0 6px 22px rgba(0,0,0,.12);border-radius:10px;padding:8px 10px;font-size:12px;white-space:nowrap;z-index:5;display:none;line-height:1.7}
.tip b{display:block;font-weight:600;margin-bottom:2px}
.tip i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.tip em{font-style:normal;color:var(--mute);font-size:11px;margin-left:4px}
.tip .r{display:flex;justify-content:space-between;gap:18px}
.empty{color:var(--mute);text-align:center;padding:48px 0;margin:0}
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:14px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.note{color:var(--mute);font-size:12.5px;margin:18px 0 0}
@media(max-width:900px){.cards,.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.pair{grid-template-columns:1fr}}
@media(max-width:560px){.wrap{padding:14px}.top-in{padding:8px 14px;gap:8px}.cards{gap:10px}.card{padding:14px}.grid{grid-template-columns:1fr}nav button{font-size:14px;padding:7px 9px}}
/* lock */
#lock{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--bg)}
.lockbox{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px 24px;text-align:center;width:100%;max-width:320px}
.lockbox h1{font-size:17px;font-weight:600;margin:0 0 4px}
.lockbox p{margin:0;color:var(--mute);font-size:13px}
.pin{display:flex;gap:10px;justify-content:center;margin:20px 0 8px}
.pin input{width:50px;height:58px;text-align:center;font:inherit;font-size:22px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);padding:0}
.pin input:focus{outline:2px solid var(--so);border-color:transparent}
.pin.shake{animation:shk .35s}@keyframes shk{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.lockmsg{color:#C2503F!important;min-height:20px;margin:4px 0 10px!important}
.rem{display:inline-flex;align-items:center;gap:6px;color:var(--mute);font-size:13px;cursor:pointer}
body.locked .top,body.locked .wrap{display:none}
</style>
</head>
<body>
<div id="lock" hidden>
 <div class="lockbox">
  <h1>ยอดขาย</h1>
  <p>กรอกรหัส 4 หลัก</p>
  <div class="pin" id="pin">
   <input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" aria-label="หลักที่ 1">
   <input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" aria-label="หลักที่ 2">
   <input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" aria-label="หลักที่ 3">
   <input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" aria-label="หลักที่ 4">
  </div>
  <p class="lockmsg" id="lockmsg"></p>
  <label class="rem"><input type="checkbox" id="rem"> จำเครื่องนี้</label>
 </div>
</div>

<header class="top"><div class="top-in">
 <nav id="tabs"><button data-t="ov" class="on">ภาพรวมยอดขาย</button><button data-t="ch">ช่องทางขาย</button></nav>
 <select id="year" aria-label="ปี"></select>
 <button id="logout" class="lo" hidden>ออก</button>
</div></header>

<main class="wrap">
 <div id="msg"></div>

 <section id="v-ov">
  <div class="cards" id="ov-cards"></div>
  <div class="panel">
   <div class="ph"><h2>ภาพรวมยอดขาย</h2><div class="legend lg"></div></div>
   <div class="chart" id="ov-chart"></div>
  </div>
 </section>

 <section id="v-ch" hidden>
  <div class="legend lg"></div>
  <div class="pair">
   <div class="panel"><div class="ph"><h2>ช่องทางของบริษัท</h2><span class="sv" id="sv-co"></span></div><div class="chart" id="c-co"></div></div>
   <div class="panel"><div class="ph"><h2>Ecommerce</h2><span class="sv" id="sv-ec"></span></div><div class="chart" id="c-ec"></div></div>
  </div>
  <h3>ช่องทางของบริษัท</h3>
  <div class="grid" id="g-co"></div>
  <h3>Ecommerce</h3>
  <div class="grid" id="g-ec"></div>
  <p class="note" id="unk" hidden></p>
 </section>
</main>

<script>
/* ===== ตั้งค่า ===== */
const CFG = {
  appsScriptUrl: 'https://script.google.com/macros/s/AKfycbwQp18kWTL5hlJQFzoFznMylmPP2jpuhscmnilyU4F2GTQ-76T9syKtpSg21tCAVRzC/exec',
  PIN: '1234',                    // ล็อกหน้าเว็บเท่านั้น ไม่ใช่ระบบรักษาความปลอดภัยของข้อมูล
  EXCLUDE_CANCELLED: true,
  COL: { date:'วันที่ซื้อ', order:'เลขที่คำสั่งซื้อ', cancel:'ยกเลิกใน shopee', ch:'ช่องทาง', price:'ราคา', net:'ยอดสุทธิ' }
};
const MTH = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const SERIES = [
  { k:'price', name:'ราคา', color:'--price' },
  { k:'net',   name:'ยอดสุทธิ', color:'--net' },
  { k:'so',    name:'ยอดขายตาม SO', color:'--so' }
];
const CHANNELS = [   // grp: co = ของบริษัท, ec = Ecommerce
  { id:'store',     name:'หน้าร้าน',               grp:'co' },
  { id:'line',      name:'LINE',                   grp:'co' },
  { id:'fb',        name:'FB',                     grp:'co' },
  { id:'b2b',       name:'LINE B2B',               grp:'co' },
  { id:'web',       name:'เว็บไซต์ Sportsynology', grp:'co' },
  { id:'ig',        name:'IG',                     grp:'co' },
  { id:'shopee',    name:'Shopee',                 grp:'ec' },
  { id:'lazada',    name:'Lazada',                 grp:'ec' },
  { id:'homepro',   name:'Homepro',                grp:'ec' },
  { id:'decathlon', name:'Decathlon',              grp:'ec' },
  { id:'sb',        name:'SB',                     grp:'ec' },
  { id:'thisshop',  name:'This Shop',              grp:'ec' },
  { id:'tiktok',    name:'TikTok',                 grp:'ec' },
  { id:'nocnoc',    name:'Nocnoc',                 grp:'ec' }
];
const CH_BY_ID = Object.fromEntries(CHANNELS.map(c => [c.id, c]));

/* จัดกลุ่มช่องทาง: ตัวแทน / มารับเอง / แถมฟรี / ไม่ระบุ / ว่าง → หน้าร้าน, งานซ่อม → ไม่นับ */
function classify(raw) {
  const k = String(raw ?? '').toLowerCase().replace(/[\s._\-]+/g, '');
  if (k.includes('ซ่อม')) return { skip: true };
  if (!k || /ตัวแทน|มารับเอง|แถมฟรี|ไม่ระบุ|หน้าร้าน/.test(k)) return { id: 'store' };
  if (k.includes('b2b')) return { id: 'b2b' };
  if (k.includes('shopee')) return { id: 'shopee' };
  if (k.includes('lazada') || k.includes('lazda')) return { id: 'lazada' };
  if (k.includes('homepro')) return { id: 'homepro' };
  if (k.includes('decathlon')) return { id: 'decathlon' };
  if (k.includes('tiktok')) return { id: 'tiktok' };
  if (k.includes('thisshop')) return { id: 'thisshop' };
  if (k.includes('nocnoc')) return { id: 'nocnoc' };
  if (k === 'sb') return { id: 'sb' };
  if (k.includes('sportsynology') || k.includes('เว็บไซต์') || k.includes('website') || k === 'web') return { id: 'web' };
  if (k === 'ig' || k.includes('instagram')) return { id: 'ig' };
  if (k === 'fb' || k.includes('facebook')) return { id: 'fb' };
  if (k.includes('line')) return { id: 'line' };
  return { id: 'store', unknown: String(raw).trim() };
}

/* ===== ตัวช่วย ===== */
const $ = id => document.getElementById(id);
const norm = s => String(s ?? '').replace(/\s+/g, ' ').trim().toLowerCase();
const num = v => Number(String(v ?? '').replace(/[,฿\s]/g, '')) || 0;
const fmt = n => Math.round(n).toLocaleString('th-TH');
const baht = n => '฿' + fmt(n);
const short = v => v >= 1e6 ? +(v / 1e6).toFixed(1) + 'M' : v >= 1e3 ? +(v / 1e3).toFixed(1) + 'k' : String(Math.round(v));
const sum = a => a.reduce((x, y) => x + y, 0);
const dayN = d => Date.UTC(+d.slice(0, 4), +d.slice(5, 7) - 1, +d.slice(8, 10)) / 864e5;
const dim = ym => new Date(+ym.slice(0, 4), +ym.slice(5, 7), 0).getDate();
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const marked = v => { const s = norm(v); return s !== '' && !['-','no','false','0','ไม่','n'].includes(s); };

function parseDate(v) {
  const s = String(v ?? '').trim(); let y, m, d, a;
  if ((a = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) { y = +a[1]; m = +a[2]; d = +a[3]; }
  else if ((a = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/))) { d = +a[1]; m = +a[2]; y = +a[3]; if (y < 100) y += 2000; if (m > 12 && d <= 12) [d, m] = [m, d]; }
  else return '';
  if (y > 2400) y -= 543;
  return y + '-' + String(m).padStart(2, '0') + '-' + String(d).padStart(2, '0');
}

/* ===== ข้อมูล ===== */
let ROWS = [], UNK = new Set(), DMIN = '', DMAX = '', YEAR = 0, AGG = null, CUR = 'ov';

function monthDone(ym) {   // เดือนนั้นมีข้อมูลครบทั้งเดือนหรือไม่
  if (!DMIN) return false;
  const a = DMIN.slice(0, 7), b = DMAX.slice(0, 7);
  if (ym < a || ym > b) return false;
  if (ym === a && +DMIN.slice(8, 10) > 3) return false;
  if (ym === b && +DMAX.slice(8, 10) < dim(ym) - 2) return false;
  return true;
}

function aggregate(year) {
  const mk = () => ({ price: Array(12).fill(0), net: Array(12).fill(0), so: Array(12).fill(0), orders: new Set() });
  const A = { all: mk(), co: mk(), ec: mk() };
  CHANNELS.forEach(c => A[c.id] = mk());
  const Y = String(year);
  for (const r of ROWS) {
    const keys = ['all', CH_BY_ID[r.chId].grp, r.chId];
    if (r.date.startsWith(Y)) { const m = +r.date.slice(5, 7) - 1; keys.forEach(k => { A[k].price[m] += r.price; A[k].net[m] += r.net; }); }
    if (r.sod.startsWith(Y)) { const m = +r.sod.slice(5, 7) - 1; keys.forEach(k => { A[k].so[m] += r.net; A[k].orders.add(r.order); }); }
  }
  return A;
}

/* Linear forecast: ถดถอยเชิงเส้นจากเดือนที่ข้อมูลครบ (ต้องมีอย่างน้อย 3 เดือน) ต่อเส้นไปถึง ธ.ค.
   เดือนปัจจุบันที่ยังไม่ครบ ใช้ค่ามากกว่าระหว่างค่าคาดการณ์กับยอดสะสมจริง */
function project(vals) {
  const ym = i => YEAR + '-' + String(i + 1).padStart(2, '0');
  const done = vals.map((_, i) => monthDone(ym(i)));
  const xs = [], ys = [];
  done.forEach((d, i) => { if (d) { xs.push(i); ys.push(vals[i]); } });
  const act = vals.map((v, i) => done[i] ? v : null), fc = Array(12).fill(null);
  const actual = sum(ys);
  if (xs.length < 3) return { act, fc, total: xs.length === 12 ? actual : null };
  const n = xs.length, mx = sum(xs) / n, my = sum(ys) / n;
  const b = sum(xs.map((x, i) => (x - mx) * (ys[i] - my))) / sum(xs.map(x => (x - mx) ** 2)), a = my - b * mx;
  let add = 0;
  for (let i = xs[n - 1] + 1; i < 12; i++) {
    let f = Math.max(0, a + b * i);
    if (ym(i) === DMAX.slice(0, 7)) f = Math.max(f, vals[i]);
    fc[i] = f; add += f;
  }
  return { act, fc, total: actual + add };
}
const seriesOf = a => SERIES.map(s => { const p = project(a[s.k]); return { name: s.name, color: s.color, act: p.act, fc: p.fc }; });

/* ===== กราฟเส้น (เส้นทึบ = จริง, เส้นประ = คาดการณ์) ===== */
function niceMax(v) {
  const pw = Math.pow(10, Math.floor(Math.log10(Math.max(v, 1))));
  return pw * ([1, 2, 3, 4, 5, 6, 8, 10].find(c => c * pw >= v) || 10);
}
function lineChart(el, series, h, dots) {
  const vals = series.flatMap(s => [...s.act, ...s.fc]).filter(v => v != null);
  if (!vals.length || Math.max(...vals) <= 0) { el.innerHTML = '<p class="empty">ไม่มีข้อมูล</p>'; el.onpointermove = el.onpointerleave = null; return; }
  const W = Math.max(260, el.clientWidth || 600), p = { l: 42, r: 10, t: 10, b: 24 }, mx = niceMax(Math.max(...vals));
  const cw = (W - p.l - p.r) / 12, x = i => p.l + (i + .5) * cw, y = v => h - p.b - v / mx * (h - p.t - p.b);
  let s = `<svg viewBox="0 0 ${W} ${h}" width="${W}" height="${h}" role="img">`;
  for (let g = 0; g <= 4; g++) { const v = mx / 4 * g;
    s += `<line x1="${p.l}" x2="${W - p.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${p.l - 6}" y="${y(v) + 4}" text-anchor="end" font-size="10.5" fill="var(--mute)">${short(v)}</text>`; }
  MTH.forEach((m, i) => { if (cw < 30 && i % 2) return; s += `<text x="${x(i)}" y="${h - 7}" text-anchor="middle" font-size="10.5" fill="var(--mute)">${m}</text>`; });
  s += `<line class="gl" y1="${p.t}" y2="${h - p.b}" stroke="var(--mute)" stroke-dasharray="2 3" style="display:none"/>`;
  const lastIdx = a => { for (let i = 11; i >= 0; i--) if (a[i] != null) return i; return -1; };
  series.forEach(sr => {
    let d = '', pen = false;
    sr.act.forEach((v, i) => { if (v == null) { pen = false; return; } d += (pen ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1) + ' '; pen = true; });
    if (d) s += `<path d="${d}" fill="none" stroke="var(${sr.color})" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    const la = lastIdx(sr.act), pts = []; if (la >= 0) pts.push([la, sr.act[la]]);
    sr.fc.forEach((v, i) => { if (v != null) pts.push([i, v]); });
    if (pts.length > 1) s += `<path d="M${pts.map(q => x(q[0]).toFixed(1) + ' ' + y(q[1]).toFixed(1)).join(' L')}" fill="none" stroke="var(${sr.color})" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round" opacity=".75"/>`;
    if (dots) sr.act.forEach((v, i) => { if (v != null) s += `<circle cx="${x(i)}" cy="${y(v)}" r="3" fill="var(${sr.color})"/>`; });
  });
  el.innerHTML = s + '</svg><div class="tip"></div>';
  const tip = el.querySelector('.tip'), gl = el.querySelector('.gl');
  const hide = () => { tip.style.display = 'none'; gl.style.display = 'none'; };
  el.onpointerleave = hide;
  el.onpointermove = e => {
    const i = Math.floor((e.clientX - el.getBoundingClientRect().left - p.l) / cw);
    if (i < 0 || i > 11) return hide();
    const rows = series.map(sr => { const v = sr.act[i] != null ? sr.act[i] : sr.fc[i]; return v == null ? '' :
      `<div class="r"><span><i style="background:var(${sr.color})"></i>${esc(sr.name)}${sr.act[i] == null ? '<em>คาดการณ์</em>' : ''}</span><b style="margin:0">${baht(v)}</b></div>`; }).join('');
    if (!rows) return hide();
    tip.innerHTML = `<b>${MTH[i]} ${YEAR}</b>${rows}`; tip.style.display = 'block';
    const tw = tip.offsetWidth; tip.style.left = Math.max(0, x(i) + 12 + tw > W ? x(i) - 12 - tw : x(i) + 12) + 'px';
    gl.setAttribute('x1', x(i)); gl.setAttribute('x2', x(i)); gl.style.display = '';
  };
}

/* ===== หน้า 1: ภาพรวมยอดขาย ===== */
const card = (l, v, s, c) => `<div class="card"><div class="l"><i style="background:var(${c || '--so'})"></i>${l}</div><div class="v">${v}</div><div class="s">${s || '&nbsp;'}</div></div>`;
function renderOv() {
  if (!AGG) { $('ov-cards').innerHTML = ''; $('ov-chart').innerHTML = '<p class="empty">ไม่มีข้อมูล</p>'; return; }
  const A = AGG.all, so = sum(A.so), net = sum(A.net), ord = A.orders.size;
  const start = DMIN > YEAR + '-01-01' ? DMIN : YEAR + '-01-01', end = DMAX < YEAR + '-12-31' ? DMAX : YEAR + '-12-31';
  const days = Math.max(1, dayN(end) - dayN(start) + 1), p = project(A.so);
  $('ov-cards').innerHTML =
    card('รายรับ', baht(net), 'ตามวันที่ซื้อ', '--net') +
    card('ยอดขายตาม SO', baht(so), 'ตามเลข SO') +
    card('จำนวนคำสั่งซื้อ', fmt(ord), 'ตามเลข SO') +
    card('AOV', ord ? baht(so / ord) : '-', 'ต่อคำสั่งซื้อ') +
    card('เฉลี่ยยอดขายต่อวัน', baht(so / days), fmt(days) + ' วัน') +
    card('คาดการณ์ยอดขายสิ้นปี', p.total == null ? '-' : baht(p.total), p.total == null ? 'ข้อมูลไม่พอ' : 'Linear forecast');
  lineChart($('ov-chart'), seriesOf(A), window.innerWidth < 560 ? 240 : 320, true);
}

/* ===== หน้า 2: ช่องทางขาย ===== */
function renderCh() {
  if (!AGG) return;
  const totSO = sum(AGG.co.so) + sum(AGG.ec.so) || 1, big = window.innerWidth < 560 ? 220 : 260;
  [['co', 'c-co', 'sv-co'], ['ec', 'c-ec', 'sv-ec']].forEach(([k, cid, sid]) => {
    const t = sum(AGG[k].so); $(sid).textContent = `SO ${baht(t)} · ${(t / totSO * 100).toFixed(0)}%`;
    lineChart($(cid), seriesOf(AGG[k]), big, true);
  });
  ['co', 'ec'].forEach(g => {
    const list = CHANNELS.filter(c => c.grp === g);
    $('g-' + g).innerHTML = list.map(c => `<div class="panel"><div class="ph"><h2>${esc(c.name)}</h2><span class="sv">SO ${baht(sum(AGG[c.id].so))}</span></div><div class="chart" id="sc-${c.id}"></div></div>`).join('');
    list.forEach(c => lineChart($('sc-' + c.id), seriesOf(AGG[c.id]), 190, false));
  });
  const u = $('unk'); u.hidden = !UNK.size;
  if (UNK.size) u.textContent = 'ช่องทางที่ไม่รู้จัก (นับรวมในหน้าร้าน): ' + [...UNK].join(', ');
}

/* ===== หน้า/เมนู ===== */
function showTab(t) {
  CUR = t;
  $('v-ov').hidden = t !== 'ov'; $('v-ch').hidden = t !== 'ch';
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.t === t));
  document.querySelectorAll('.lg').forEach(e => e.innerHTML = SERIES.map(s => `<span><i style="background:var(${s.color})"></i>${s.name}</span>`).join('') + '<span class="dash"><i></i>คาดการณ์</span>');
  (t === 'ov' ? renderOv : renderCh)();
}
let lastW = window.innerWidth;
window.addEventListener('resize', () => { clearTimeout(window._rz); window._rz = setTimeout(() => { if (window.innerWidth === lastW) return; lastW = window.innerWidth; showTab(CUR); }, 200); });
function warn(t) { $('msg').style.display = 'block'; $('msg').textContent = t; }

/* ===== โหลดข้อมูลจาก Google Apps Script ===== */
async function init() {
  try {
    const res = await fetch(CFG.appsScriptUrl + '?t=' + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const j = await res.json(), raw = j.rows || [], C = CFG.COL;
    if (!raw.length) warn('เชื่อมต่อได้ แต่ไม่พบแถวข้อมูล');
    else {
      const have = Object.keys(raw[0]).map(norm), miss = Object.values(C).filter(h => !have.includes(norm(h)));
      if (miss.length) warn('ไม่พบคอลัมน์: ' + miss.join(', ') + ' · หัวตารางที่พบ: ' + Object.keys(raw[0]).join(', '));
    }
    ROWS = raw.map((r, i) => {
      const n = {}; for (const k in r) n[norm(k)] = r[k];
      const g = k => n[norm(C[k])], order = String(g('order') ?? '').trim() || ('(ว่าง)' + i), ou = order.toUpperCase();
      const ch = String(g('ch') ?? '').trim(), c = classify(ch);
      if (c.unknown) UNK.add(c.unknown);
      const m = /^S(\d{2})(\d{2})(\d{2})\d+$/.exec(ou);
      return { date: parseDate(g('date')), order, cancel: marked(g('cancel')), skip: !!c.skip, chId: c.id,
        price: num(g('price')), net: num(g('net')),
        sod: m && +m[2] >= 1 && +m[2] <= 12 && +m[3] >= 1 && +m[3] <= 31 ? '20' + m[1] + '-' + m[2] + '-' + m[3] : '' };   // วันที่ตามเลข SO = S+ปี+เดือน+วัน+เลขรายการ
    }).filter(r => !(CFG.EXCLUDE_CANCELLED && r.cancel) && !r.skip);   // งานซ่อมไม่นับเป็นยอดขาย
    const ds = ROWS.flatMap(r => [r.date, r.sod]).filter(Boolean).sort();
    DMIN = ds[0] || ''; DMAX = ds[ds.length - 1] || '';
  } catch (e) { warn('โหลดข้อมูลไม่สำเร็จ (' + e.message + ')'); }
  const years = [...new Set(ROWS.flatMap(r => [r.date, r.sod]).filter(Boolean).map(d => d.slice(0, 4)))].sort().reverse();
  $('year').innerHTML = years.map(y => `<option value="${y}">${y}</option>`).join('');
  YEAR = years.length ? +(DMAX.slice(0, 4)) : 0; if (YEAR) $('year').value = String(YEAR);
  AGG = YEAR ? aggregate(YEAR) : null;
  $('year').addEventListener('change', () => { YEAR = +$('year').value; AGG = aggregate(YEAR); showTab(CUR); });
  document.querySelectorAll('#tabs button').forEach(b => b.addEventListener('click', () => showTab(b.dataset.t)));
  showTab('ov');
}

/* ===== ล็อกหน้าเว็บด้วยรหัส 4 หลัก ===== */
const LS_KEY = 'dash_unlocked';
const getOK = () => { try { return localStorage.getItem(LS_KEY) === CFG.PIN || sessionStorage.getItem(LS_KEY) === CFG.PIN; } catch (e) { return false; } };
const setOK = remember => { try { (remember ? localStorage : sessionStorage).setItem(LS_KEY, CFG.PIN); } catch (e) {} };
const clearOK = () => { try { localStorage.removeItem(LS_KEY); sessionStorage.removeItem(LS_KEY); } catch (e) {} };
let started = false;
function unlock() {
  document.body.classList.remove('locked'); $('lock').hidden = true; $('logout').hidden = false;
  if (!started) { started = true; init(); }
}
function showLock() {
  document.body.classList.add('locked'); $('lock').hidden = false; $('logout').hidden = true; $('lockmsg').textContent = '';
  const ins = [...document.querySelectorAll('#pin input')]; ins.forEach(i => i.value = ''); ins[0].focus();
}
function setupLock() {
  const ins = [...document.querySelectorAll('#pin input')];
  const check = () => {
    const v = ins.map(i => i.value).join(''); if (v.length < ins.length) return;
    if (v === CFG.PIN) { setOK($('rem').checked); unlock(); return; }
    $('lockmsg').textContent = 'รหัสไม่ถูกต้อง'; $('pin').classList.remove('shake'); void $('pin').offsetWidth; $('pin').classList.add('shake');
    ins.forEach(i => i.value = ''); ins[0].focus();
  };
  ins.forEach((inp, i) => {
    inp.addEventListener('input', () => { inp.value = inp.value.replace(/\D/g, '').slice(-1); if (inp.value && i < ins.length - 1) ins[i + 1].focus(); check(); });
    inp.addEventListener('keydown', e => { if (e.key === 'Backspace' && !inp.value && i > 0) ins[i - 1].focus(); });
    inp.addEventListener('paste', e => {
      const t = ((e.clipboardData && e.clipboardData.getData('text')) || '').replace(/\D/g, '').slice(0, ins.length); if (!t) return;
      e.preventDefault(); t.split('').forEach((c, k) => ins[k].value = c); ins[Math.min(t.length, ins.length) - 1].focus(); check();
    });
  });
  $('logout').addEventListener('click', () => { clearOK(); showLock(); });
  getOK() ? unlock() : showLock();
}
setupLock();
</script>
